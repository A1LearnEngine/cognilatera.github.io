<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniLatera</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }
        .logo-container {
            /* Begrenzt die maximale Breite des Logos, damit es nicht den Bildschirm sprengt */
            max-width: 380px; 
            width: 85%;
            margin-bottom: 10px;
            text-align: center;
        }
        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .subtitle {
            color: #a0a0a0;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 35px; /* Kompakterer Abstand zum Button */
            font-weight: 300;
        }
        .enter-button {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 12px 35px;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
        }
        .enter-button:hover {
            background-color: #d4af37;
            color: #0a0a0a;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
    </style>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" alt="CogniLatera Logo">
    </div>

    <div class="subtitle">by Linda Shahin</div>

    <a href="#" class="enter-button">Please enter</a>
